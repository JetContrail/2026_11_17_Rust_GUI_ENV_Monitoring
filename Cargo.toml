[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/JetContrail/2026_11_17_Rust_GUI_ENV_Monitoring"

[workspace.dependencies]
envmon-core = { path = "crates/envmon-core" }
eframe = "0.37"
egui = "0.37"
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
